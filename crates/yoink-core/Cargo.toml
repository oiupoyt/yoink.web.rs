[package]
name = "yoink-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
regex = "1"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
async-trait = "0.1"
